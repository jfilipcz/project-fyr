image:
  repository: cpdevregistry.azurecr.io/project-fyr
  tag: v1.0.32

config:
  watchAllNamespaces: true
  systemNamespaces: "kube-system,kube-public,kube-node-lease,default,monitoring,logging,ingress-nginx,cert-manager,flux-system,argocd,project-fyr,istio-system,elastic-system"
  dashboardBaseUrl: "https://fyr.ci.example.com"
  databaseUrl: "mysql+pymysql://projectfyr:fyr-secure-password-2026@project-fyr-mysql:3306/projectfyr"
  slackDefaultChannel: "C0A451TPJMD"  # #fyr-dev-slack-notifications
  slack:
    socketModeEnabled: true
    appToken: ""  # From secret
    signingSecret: ""  # From secret
    botToken: ""  # From secret

slackHandler:
  enabled: true
  replicas: 1

auth:
  enabled: true
  mode: sso
  sso:
    provider: entra
    tenantId: ""  # Set from secret
    clientId: ""  # Set from secret
    clientSecret: ""  # Set from secret

mysql:
  enabled: true
  image:
    registry: ""
    repository: mysql
    tag: "8.0"
  auth:
    rootPassword: "fyr-root-password-2026"
    database: projectfyr
    username: projectfyr
    password: "fyr-secure-password-2026"
  primary:
    persistence:
      enabled: true
      size: 10Gi
    extraEnvVars:
      - name: MYSQL_ROOT_HOST
        value: "%"
