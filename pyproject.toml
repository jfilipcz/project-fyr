[project]
name = "project-fyr"
version = "0.1.0"
description = "Kubernetes-native deployment troubleshooting assistant"
requires-python = ">=3.9"
authors = [{name = "Project Fyr Team"}]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1.0",
    "cryptography>=41.0.0",
    "kubernetes>=28.1.0",
    "langchain>=0.1.16",
    "langchain-openai>=0.0.8",
    "openai>=1.13",
    "slack_sdk>=3.27",
    "slack_bolt>=1.18.0",
    "tenacity>=8.2",
    "fastapi>=0.136.3",
    "starlette>=1.0.1,<2.0.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.3",
    "httpx>=0.26.0",
    "prometheus-client>=0.20.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["project_fyr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
]

[tool.ruff]
target-version = "py311"
line-length = 120
