{{- if .Values.slackHandler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "project-fyr.fullname" . }}-slack-handler
  labels:
    {{- include "project-fyr.labels" . | nindent 4 }}
    app.kubernetes.io/name: project-fyr
    app.kubernetes.io/component: slack-handler
spec:
  replicas: {{ .Values.slackHandler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: slack-handler
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: slack-handler
        app.kubernetes.io/name: project-fyr
    spec:
      serviceAccountName: {{ default (printf "%s-sa" .Release.Name) .Values.serviceAccount.name }}
      containers:
        - name: slack-handler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - project_fyr.slack_handler
          envFrom:
            - configMapRef:
                name: {{ include "project-fyr.fullname" . }}
            - secretRef:
                name: project-fyr-secrets
            - secretRef:
                name: fyr-slack-secrets
            {{- if .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.slackHandler.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
      {{- with .Values.slackHandler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.slackHandler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.slackHandler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
