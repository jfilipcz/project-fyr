apiVersion: v1
kind: Secret
metadata:
  name: {{ include "project-fyr.inlineSecretName" . }}
  labels:
    {{- include "project-fyr.labels" . | nindent 4 }}
    app.kubernetes.io/name: project-fyr
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  PROJECT_FYR_DATABASE_URL: {{ tpl .Values.config.databaseUrl . | quote }}
  {{- if .Values.config.slackBotToken }}
  PROJECT_FYR_SLACK_BOT_TOKEN: {{ .Values.config.slackBotToken | quote }}
  {{- end }}
  {{- if .Values.config.slack }}
  {{- if .Values.config.slack.appToken }}
  PROJECT_FYR_SLACK_APP_TOKEN: {{ .Values.config.slack.appToken | quote }}
  {{- end }}
  {{- if .Values.config.slack.signingSecret }}
  PROJECT_FYR_SLACK_SIGNING_SECRET: {{ .Values.config.slack.signingSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.openaiApiKey }}
  PROJECT_FYR_OPENAI_API_KEY: {{ .Values.config.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.auth.enabled }}
  {{- if .Values.auth.sso.clientSecret }}
  PROJECT_FYR_SSO_CLIENT_SECRET: {{ .Values.auth.sso.clientSecret | quote }}
  {{- end }}
  {{- if .Values.auth.local.jwtSecret }}
  PROJECT_FYR_LOCAL_AUTH_JWT_SECRET: {{ .Values.auth.local.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.auth.admin.password }}
  PROJECT_FYR_ADMIN_PASSWORD: {{ .Values.auth.admin.password | quote }}
  {{- end }}
  {{- end }}
