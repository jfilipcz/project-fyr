# Docker image configuration
image:
  repository: your-registry.example.com/project-fyr
  tag: latest
  pullPolicy: IfNotPresent

watcher:
  replicaCount: 1
  command:
    - python
    - -m
    - project_fyr.service
  args: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

analyzer:
  replicaCount: 1
  command:
    - python
    - -m
    - project_fyr.analyzer_service
  args: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Slack Socket Mode handler for slash commands and interactivity
# This connects to Slack via WebSocket (no public URL needed)
slackHandler:
  enabled: false
  replicaCount: 1
  command:
    - python
    - -m
    - project_fyr.slack_handler
  args: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

dashboard:
  replicaCount: 1
  command:
    - uvicorn
    - project_fyr.dashboard:app
    - --host
    - 0.0.0.0
    - --port
    - "8000"
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: fyr.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: fyr-dashboard-tls
    #    hosts:
    #      - fyr.example.com
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

metrics:
  # Prometheus metrics configuration
  serviceMonitor:
    # Enable ServiceMonitor for Prometheus Operator
    enabled: false
    # Namespace where ServiceMonitor should be created (defaults to release namespace)
    namespace: ""
    # Additional labels for ServiceMonitor (useful for Prometheus operator label selectors)
    additionalLabels: {}
      # prometheus: kube-prometheus
    # Scrape interval (default: 30s)
    interval: 30s
    # Scrape timeout (default: 10s)
    scrapeTimeout: 10s
    # Namespace selector for discovering endpoints
    namespaceSelector: {}
    # Relabeling configs to apply to samples before ingestion
    relabelings: []
    # MetricRelabelConfigs to apply to samples before ingestion
    metricRelabelings: []

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# Application configuration
config:
  # Database connection string (SQLite for development, MySQL/PostgreSQL for production)
  databaseUrl: sqlite:////data/project_fyr.db
  # Name of your Kubernetes cluster (shown in Slack notifications)
  clusterName: my-cluster
  # Timeout in seconds before marking a rollout as failed
  rolloutTimeoutSeconds: 900
  
  # Watch behavior configuration
  # If true, monitor ALL deployments regardless of labels/annotations
  # WARNING: Use with caution in large clusters
  watchAllNamespaces: false
  # If true, allow namespace-level project-fyr/enabled annotation to enable monitoring
  # for all deployments in that namespace (ignored if watchAllNamespaces=true)
  namespaceLabelEnabled: true
  
  # System namespaces to exclude from monitoring
  # These namespaces will not be watched for deployments, even if watchAllNamespaces=true
  # Comma-separated list of namespace names
  systemNamespaces: "kube-system,kube-public,kube-node-lease,default,monitoring,logging,ingress-nginx,cert-manager,flux-system,argocd,project-fyr,istio-system,elastic-system"
  
  # Slack bot token (xoxb-...) - recommend using existingSecret instead
  slackBotToken: ""
  # Default Slack channel for notifications (e.g., #deployments)
  slackDefaultChannel: "#alerts"
  # Optional: Override Slack API URL (useful for testing with mock service)
  slackApiUrl: ""
  
  # Slack Socket Mode configuration (for slash commands without public URL)
  slack:
    # Enable Socket Mode for slash commands and interactivity
    socketModeEnabled: false
    # App-Level Token (xapp-...) for Socket Mode connection
    # Required if socketModeEnabled is true
    appToken: ""
    # Signing secret for request verification
    signingSecret: ""
  
  # Fyr Dashboard base URL (for deep links in Slack messages)
  # e.g., https://fyr.internal.company.com
  dashboardBaseUrl: ""
  
  # OpenAI API key - recommend using existingSecret instead
  openaiApiKey: ""
  # OpenAI API base URL (for Azure OpenAI, set to https://your-resource.openai.azure.com)
  openaiApiBase: ""
  # Azure OpenAI API version (e.g., 2024-02-15-preview)
  openaiApiVersion: ""
  # Azure OpenAI deployment name
  azureDeployment: ""
  # LangChain model name (e.g., gpt-4o-mini, gpt-4-turbo-preview)
  langchainModelName: gpt-4o-mini
  # Prometheus URL for metrics queries (optional)
  prometheusUrl: ""

# Authentication configuration
auth:
  # Enable authentication for dashboard access
  enabled: true
  # Authentication mode: 'sso', 'local', or 'hybrid'
  mode: hybrid
  
  # SSO Configuration (Microsoft Entra ID / Azure AD)
  sso:
    # SSO provider: 'entra', 'okta', 'generic_oidc'
    provider: entra
    # Azure AD / Entra ID tenant ID - set via existingSecret or override
    tenantId: ""
    # Application (client) ID from Azure AD app registration - set via existingSecret or override
    clientId: ""
    # Client secret (recommend using existingSecret instead)
    clientSecret: ""
  
  # Local Authentication Configuration
  local:
    # Enable local username/password authentication
    enabled: true
    # JWT secret for token signing (recommend using existingSecret instead)
    # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
    jwtSecret: ""
    # JWT token expiry in hours
    jwtExpiryHours: 24
    # Session expiry in hours
    sessionExpiryHours: 168  # 7 days
  
  # Default admin user (created on first startup if it doesn't exist)
  admin:
    # Admin username
    username: admin
    # Admin password (recommend using existingSecret instead)
    password: ""
    # Admin email
    email: admin@example.com
  
  # Paths excluded from authentication (comma-separated)
  # These paths are accessible without login
  excludePaths: "/health,/metrics,/static,/api/webhook"

secrets:
  # Name of an existing Secret created by External Secret Operator that contains
  # any PROJECT_FYR_* keys (e.g., Slack tokens, OpenAI API keys, DB credentials).
  # For auth, can include:
  #   PROJECT_FYR_SSO_CLIENT_SECRET
  #   PROJECT_FYR_LOCAL_AUTH_JWT_SECRET
  #   PROJECT_FYR_ADMIN_PASSWORD
  existingSecret: "fyr-auth-secrets"

mysql:
  enabled: false
  architecture: standalone
  auth:
    rootPassword: ""
    username: projectfyr
    password: projectfyr
    database: projectfyr
  primary:
    persistence:
      enabled: false
