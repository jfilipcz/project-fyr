<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Project Fyr</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .login-bg {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        .btn-loading {
            position: relative;
        }
        .btn-loading .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <!-- Logo card -->
        <div class="bg-white rounded-xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2 mb-2">
                    <img src="/static/favicon.png" alt="Fyr" class="h-8 w-8">
                    <h1 class="text-2xl font-bold text-gray-900">Project Fyr</h1>
                </div>
                <p class="text-sm text-gray-500">Kubernetes Rollout Intelligence</p>
            </div>

            <!-- Alert -->
            <div id="alert" class="hidden rounded-lg p-3 mb-4 text-sm"></div>

            {% if local_auth_enabled %}
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus
                           class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required
                           class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                </div>
                <button type="submit" id="loginBtn"
                        class="w-full py-2.5 px-4 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700 focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all disabled:bg-gray-300 disabled:cursor-not-allowed">
                    <span class="btn-text">Sign In</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
            {% endif %}

            {% if local_auth_enabled and sso_enabled %}
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                <div class="relative flex justify-center text-xs"><span class="px-2 bg-white text-gray-500">OR</span></div>
            </div>
            {% endif %}

            {% if sso_enabled %}
            <button onclick="ssoLogin()"
                    class="w-full py-2.5 px-4 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all flex items-center justify-center gap-2">
                <svg width="18" height="18" viewBox="0 0 21 21" fill="none">
                    <path d="M0 0h10v10H0z" fill="#F25022"/>
                    <path d="M11 0h10v10H11z" fill="#7FBA00"/>
                    <path d="M0 11h10v10H0z" fill="#00A4EF"/>
                    <path d="M11 11h10v10H11z" fill="#FFB900"/>
                </svg>
                Sign in with Microsoft
            </button>
            {% endif %}
        </div>
    </div>

    <script>
        var loginForm = document.getElementById('loginForm');
        var loginBtn = document.getElementById('loginBtn');
        var alertDiv = document.getElementById('alert');

        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = 'rounded-lg p-3 mb-4 text-sm ' +
                (type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200');
            if (type === 'success') setTimeout(function() { alertDiv.className = 'hidden'; }, 3000);
        }

        function setLoading(loading) {
            if (!loginBtn) return;
            loginBtn.disabled = loading;
            var text = loginBtn.querySelector('.btn-text');
            var spinner = loginBtn.querySelector('.spinner');
            if (loading) { text.classList.add('hidden'); spinner.classList.remove('hidden'); }
            else { text.classList.remove('hidden'); spinner.classList.add('hidden'); }
        }

        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                alertDiv.className = 'hidden';
                setLoading(true);
                var username = document.getElementById('username').value;
                var password = document.getElementById('password').value;

                fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                })
                .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                .then(function(res) {
                    if (res.ok) {
                        showAlert('Login successful! Redirecting...', 'success');
                        setTimeout(function() { window.location.href = '/'; }, 500);
                    } else {
                        showAlert(res.data.detail || 'Login failed. Please check your credentials.');
                        setLoading(false);
                    }
                })
                .catch(function() {
                    showAlert('Network error. Please try again.');
                    setLoading(false);
                });
            });
        }

        function ssoLogin() { window.location.href = '/auth/sso/login'; }
    </script>
</body>
</html>
